name: simple_app_settings
description: Keeps an app's settings in one flat JSON file, beside the executable for a portable copy and under Local AppData otherwise.
version: 0.1.0
repository: https://github.com/aurelitec/thumbico
publish_to: none

environment:
  sdk: ^3.13.4

platforms:
  windows:

dependencies:
  # The @protected and @internal annotations on the package's API
  meta: ^1.19.0

  # Builds the settings file's path, beside the executable or under Local AppData
  path: ^1.9.1

dev_dependencies:
  # The lint set for pure Dart packages, which analysis_options.yaml includes
  lints: ^6.1.0

  test: ^1.32.0
