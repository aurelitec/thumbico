name: thumbico
description: "See any file the way Windows sees it: its thumbnail or icon at the size you choose, pixel for pixel, ready to save or copy."
publish_to: 'none'

# Becomes the executable's version resource and names the release packages; the About window's
# copy in strings.dart is kept equal to it by a test.
version: 2.0.0

environment:
  sdk: ^3.14.0-252.0.dev

dependencies:
  flutter:
    sdk: flutter

  # The project's own packages, under packages/

  # The settings file, beside the executable for a portable copy or under Local AppData
  simple_app_settings:
    path: packages/simple_app_settings

  # The engine that asks the Windows shell for a thumbnail or icon
  thumbico_core:
    path: packages/thumbico_core

  # Packages from pub.dev

  # Native memory for the Win32 calls the app makes itself
  ffi: ^2.2.0

  # The Open and Save as dialogs
  filepicker_windows: ^3.0.2

  # Encodes a saved or copied image, and flattens transparency for formats without it
  image: ^4.10.1

  # The app's icons, from the Material Symbols set
  material_symbols_icons: ^4.2960.0

  # Material widgets and theming, published apart from the Flutter framework
  material_ui: ^1.4.0

  # File names: the window title, and the saved file's default name and format
  path: ^1.9.1

  # Holds the newest read request while a read runs, so reads never pile up
  stream_transform: ^2.1.2

  # Dropped files, the clipboard, the browser, and the window's position between runs
  win32: ^6.4.0

  # Puts the image on the clipboard
  win32_clipboard: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The lint set for Flutter apps, which analysis_options.yaml includes
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The app icon as the About window and the empty canvas draw it; a copy of a file the icon's
  # build script makes, kept outside this repo.
  assets:
    - assets/app_icon.png
