name: thumbico
description: "See any file the way Windows sees it: its thumbnail or icon at the size you choose, pixel for pixel, ready to save or copy."
publish_to: 'none'

# Becomes the executable's version resource and names the release packages; the About window's
# copy in strings.dart is kept equal to it by a test.
version: 2.0.0

environment:
  sdk: ^3.14.0-252.0.dev

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.4.0

  thumbico_core:
    path: packages/thumbico_core

  filepicker_windows: ^3.0.2

  ffi: ^2.2.0
  win32: ^6.4.0
  win32_clipboard: ^2.0.3

  image: ^4.10.1
  path: ^1.9.1
  stream_transform: ^2.1.2

  simple_app_settings:
    path: packages/simple_app_settings

  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The app icon as the About window and the empty canvas draw it; a copy of a file the icon's
  # build script makes, kept outside this repo.
  assets:
    - assets/app_icon.png
