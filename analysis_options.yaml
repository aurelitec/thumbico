# The first include activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
# The second holds the project's own rules and formatter settings, shared
# with the packages under packages/.
include:
  - package:flutter_lints/flutter.yaml
  - analysis_rules.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
